name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: pipx install "poetry>=2.2"
      - name: Instalar dependencias
        run: poetry install --no-interaction
      # NOTE: `ruff format --check` is intentionally NOT run: 13 files already on main are
      # unformatted. Enable it once they are formatted in a dedicated cleanup PR.
      - name: Ruff (lint)
        run: poetry run ruff check .
      - name: Pruebas
        run: poetry run pytest -q

  widget:
    name: widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar el widget
        id: detect
        run: |
          if [ -f widget/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::widget/package.json no existe: se omite el job del widget."
          fi
          # El custom element llega en un PR posterior de la serie del widget: hasta entonces
          # no hay punto de entrada que empaquetar y se omiten el build y el artefacto.
          if [ -f widget/src/ai-chat-agent.js ]; then
            echo "entry=true" >> "$GITHUB_OUTPUT"
          else
            echo "entry=false" >> "$GITHUB_OUTPUT"
            echo "::notice::widget/src/ai-chat-agent.js no existe todavía: se omite el build."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - name: Instalar dependencias
        if: steps.detect.outputs.present == 'true'
        working-directory: widget
        run: npm ci
      - name: ESLint
        if: steps.detect.outputs.present == 'true'
        working-directory: widget
        run: npm run lint
      - name: Pruebas
        if: steps.detect.outputs.present == 'true'
        working-directory: widget
        run: npm test
      - name: Build
        if: steps.detect.outputs.present == 'true' && steps.detect.outputs.entry == 'true'
        working-directory: widget
        run: npm run build
      - name: Publicar artefacto del widget
        if: steps.detect.outputs.present == 'true' && steps.detect.outputs.entry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: widget/dist
          if-no-files-found: error
          retention-days: 14

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agente-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar el contenedor y verificar /health
        run: |
          # Placeholder secrets for CI only; the container just needs to boot.
          docker run -d --name agente-ci -p 8000:8000 \
            -e AUTH_JWT_SECRET=ci-only-placeholder-secret-0123456789abcdef \
            agente-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health no respondió a tiempo"
          docker logs agente-ci
          exit 1
      - name: Detener contenedor
        if: always()
        run: docker rm -f agente-ci || true
